set default=0
set timeout=5
set timeout_style=menu
set color_normal=light-red/black
set color_highlight=white/red
set menu_color_normal=light-red/black
set menu_color_highlight=white/red

terminal_input console
terminal_output console

menuentry "Start SventOS" --id=svent-live {
    clear
    linux @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
}

menuentry "Safe graphics" --id=svent-safe {
    clear
    linux @KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
    initrd @INITRD_LIVE@
}
