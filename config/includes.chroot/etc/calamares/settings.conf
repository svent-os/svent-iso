modules-search:
- /etc/calamares/modules
- local
instances:
- id: desktop
  module: packagechooser
  config: desktop.conf
- id: boot
  module: packagechooser
  config: boot.conf
- id: prepare
  module: sventinstall
  config: prepare.conf
- id: configure
  module: sventinstall
  config: configure.conf
- id: validate
  module: sventinstall
  config: validate.conf
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@desktop
  - netinstall
  - packagechooser@boot
  - partition
  - users
  - summary
- exec:
  - sventinstall@validate
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - sventinstall@prepare
  - locale
  - keyboard
  - localecfg
  - users
  - hwclock
  - sventinstall@configure
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
branding: svent
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
