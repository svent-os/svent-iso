defaultGroups:
- users
- audio
- video
- plugdev
- netdev
- sudo
sudoersGroup: sudo
sudoersConfigureWithGroup: true
autologinGroup: ''
setRootPassword: false
doReusePassword: false
doAutologin: false
allowWeakPasswords: false
user:
  shell: /bin/zsh
  forbidden_names:
  - root
  - svent-live
  - nobody
  home_permissions: o700
hostname:
  location: EtcFile
  writeHostsFile: true
  template: sventos
  forbidden_names:
  - localhost
